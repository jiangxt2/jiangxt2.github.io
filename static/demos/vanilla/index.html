<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>原生 JavaScript Demo</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="demo-shell">
      <a class="back-link" href="../../../">← 返回博客</a>
      <section class="demo-panel">
        <p class="eyebrow">VANILLA JAVASCRIPT</p>
        <h1>原生 HTML + JavaScript</h1>
        <p class="intro">这是一个不依赖框架的静态网页，HTML、CSS 和 JavaScript 都由 GitHub Pages 直接提供。</p>
        <div class="counter-card">
          <span id="count" class="count">0</span>
          <span class="count-label">次点击</span>
          <div class="actions">
            <button id="decrease" type="button">减少</button>
            <button id="increase" type="button">增加</button>
          </div>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
