<article class="post-card">
  <div class="post-card-top">
    {{ with .Date }}<time datetime="{{ .Format "2006-01-02" }}">{{ .Format "2006-01-02" }}</time>{{ end }}
    {{ with .Params.categories }}<span>{{ index . 0 }}</span>{{ end }}
  </div>
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p>{{ .Summary | plainify | truncate 140 }}</p>
  {{ with .Params.tags }}
    <div class="tag-list" aria-label="文章标签">
      {{ range first 3 . }}<span>#{{ . }}</span>{{ end }}
    </div>
  {{ end }}
</article>
